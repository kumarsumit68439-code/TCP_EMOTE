<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Creator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#0b0d12;color:#eef1f7;height:100vh;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{height:100vh;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #242936;background:#11141b}.brand{font-weight:800;font-size:19px;display:flex;gap:9px;align-items:center}.logo{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,#7c5cff,#29d3ff);display:grid;place-items:center;font-weight:900}.top .spacer{flex:1}.btn{background:#1b202b;border:1px solid #2b3240;border-radius:9px;padding:9px 13px}.btn:hover{background:#252b38}.primary{background:#7257ff;border-color:#8068ff}.primary:hover{background:#836cff}.layout{display:grid;grid-template-columns:230px 1fr 290px;min-height:0}.side{background:#10131a;border-right:1px solid #242936;padding:16px;overflow:auto}.right{border-left:1px solid #242936}.title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#7f8798;margin:4px 0 12px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tool{padding:14px 9px;background:#171b24;border:1px solid #292f3b;border-radius:10px;text-align:center}.tool:hover{border-color:#6656c9;transform:translateY(-1px)}.ico{font-size:21px;display:block;margin-bottom:6px}.tool small{color:#a9afbd}.canvasArea{min-width:0;display:flex;flex-direction:column;background:#0d1016}.bar{height:48px;border-bottom:1px solid #242936;display:flex;align-items:center;gap:7px;padding:0 14px}.bar .spacer{flex:1}.stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:34px;background-image:radial-gradient(#252a34 1px,transparent 1px);background-size:18px 18px}.artboard{position:relative;background:white;color:#111;width:820px;min-height:620px;box-shadow:0 20px 70px #0008;border-radius:4px;overflow:hidden}.artboard.mobile{width:390px;min-height:700px}.el{position:absolute;min-width:30px;min-height:20px;user-select:none;cursor:move}.el.selected{outline:2px solid #7257ff;outline-offset:3px}.el button{pointer-events:none}.handle{position:absolute;width:7px;height:7px;background:#7257ff;border-radius:50%;right:-5px;bottom:-5px}.panel{padding:16px;overflow:auto}.empty{color:#7e8697;font-size:13px;line-height:1.6}.field{margin:12px 0}.field label{display:block;font-size:11px;color:#929aaa;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#171b24;color:#edf0f5;border:1px solid #2c3340;border-radius:8px;padding:9px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7257ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{color:#ff7f8a;background:#24161a;border:1px solid #4a242b}.code{height:100%;padding:15px;background:#0a0d12;color:#dce3ef;white-space:pre;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.tab{padding:7px 11px;border-radius:7px;color:#8e96a7;background:transparent}.tab.active{background:#202532;color:#fff}.hidden{display:none!important}.status{font-size:11px;color:#8d96a8}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202631;border:1px solid #343c4b;padding:10px 15px;border-radius:10px;display:none;z-index:20}
@media(max-width:900px){.layout{grid-template-columns:190px 1fr}.right{display:none}.tools{grid-template-columns:1fr 1fr}.top{padding:0 10px}.top .btn{padding:7px 9px}.artboard{width:700px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">D</div>Design Creator</div><div class="status" id="saveStatus">Auto saved</div><div class="spacer"></div><button class="btn" id="newBtn">New</button><button class="btn" id="previewBtn">Preview</button><button class="btn primary" id="exportBtn">Export</button></header>
<div class="layout"><aside class="side"><div class="title">Components</div><div class="tools" id="tools"></div><div class="title" style="margin-top:22px">Project</div><button class="btn" style="width:100%;margin-bottom:8px" id="saveBtn">💾 Save locally</button><button class="btn danger" style="width:100%" id="clearBtn">🗑 Clear canvas</button></aside>
<main class="canvasArea"><div class="bar"><button class="tab active" data-mode="design">Design</button><button class="tab" data-mode="source">Source</button><button class="tab" data-mode="json">JSON</button><div class="spacer"></div><select id="device" class="btn"><option value="desktop">Desktop 820px</option><option value="mobile">Mobile 390px</option></select></div><div class="stage" id="stage"><div class="artboard" id="artboard"></div></div><pre class="code hidden" id="code"></pre></main>
<aside class="side right"><div class="title">Properties</div><div id="props" class="panel"><div class="empty">Select a component on the canvas to edit its properties.</div></div></aside></div></div><div class="toast" id="toast"></div>
<script>
const types={text:['T','Text'],heading:['H','Heading'],button:['▣','Button'],card:['▦','Card'],input:['▭','Input'],image:['▧','Image'],divider:['—','Divider'],container:['□','Container']};
let design=JSON.parse(localStorage.getItem('design-creator')||'null')||{width:820,height:620,bg:'#ffffff',components:[]};let selected=null,mode='design',drag=null;
const $=s=>document.querySelector(s), art=$('#artboard'), props=$('#props'), code=$('#code'), stage=$('#stage');
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defaults(type){let base={id:uid(),type,x:50,y:50,w:180,h:50,text:'',color:'#111827',bg:'#ffffff',fontSize:16,radius:10,padding:12,border:'#d1d5db'};if(type==='text')Object.assign(base,{text:'Your text',w:240,h:40});if(type==='heading')Object.assign(base,{text:'Design a beautiful interface',w:500,h:60,fontSize:30});if(type==='button')Object.assign(base,{text:'Get Started',w:140,h:46,bg:'#7257ff',color:'#ffffff',radius:10});if(type==='card')Object.assign(base,{text:'Card title\nAdd your content here.',w:280,h:150,bg:'#f8fafc',radius:16,padding:20});if(type==='input')Object.assign(base,{text:'Enter your text...',w:280,h:46,color:'#64748b'});if(type==='image')Object.assign(base,{text:'https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=800&q=80',w:300,h:180,radius:14});if(type==='divider')Object.assign(base,{w:400,h:2,bg:'#d1d5db',color:'#d1d5db'});if(type==='container')Object.assign(base,{w:360,h:220,bg:'#f3f4f6',radius:18});return base}
function add(type){const c=defaults(type);design.components.push(c);selected=c.id;save();render()}
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function render(){art.style.width=design.width+'px';art.style.minHeight=design.height+'px';art.style.background=design.bg;art.classList.toggle('mobile',design.width===390);art.innerHTML='';design.components.forEach(c=>{let e=document.createElement('div');e.className='el'+(c.id===selected?' selected':'');e.dataset.id=c.id;e.style.left=c.x+'px';e.style.top=c.y+'px';e.style.width=c.w+'px';e.style.height=c.h+'px';e.style.color=c.color;e.style.background=c.bg;e.style.borderRadius=c.radius+'px';e.style.padding=c.padding+'px';e.style.fontSize=c.fontSize+'px';e.style.border=c.type==='button'?'0':`1px solid ${c.border||'transparent'}`;e.style.display='flex';e.style.alignItems=c.type==='divider'?'stretch':'center';e.style.justifyContent=c.type==='divider'?'stretch':'center';e.style.whiteSpace='pre-wrap';e.style.overflow='hidden';if(c.type==='heading'||c.type==='text'||c.type==='card')e.style.textAlign='center';if(c.type==='button')e.innerHTML='<button style="width:100%;height:100%;border:0;background:transparent;color:inherit;font:inherit">'+esc(c.text)+'</button>';else if(c.type==='image')e.innerHTML='<img src="'+esc(c.text)+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';else if(c.type==='input')e.innerHTML='<input disabled placeholder="'+esc(c.text)+'" style="width:100%;height:100%;border:0;background:transparent;outline:0;color:inherit;font:inherit">';else e.textContent=c.text;e.addEventListener('pointerdown',ev=>startDrag(ev,c));e.addEventListener('click',ev=>{ev.stopPropagation();selected=c.id;renderProps();render()});art.appendChild(e)});renderProps();updateCode()}
function startDrag(ev,c){if(mode!=='design')return;drag={c,sx:ev.clientX,sy:ev.clientY,x:c.x,y:c.y};ev.currentTarget.setPointerCapture?.(ev.pointerId);window.onpointermove=e=>{if(!drag)return;c.x=Math.max(0,Math.round(drag.x+e.clientX-drag.sx));c.y=Math.max(0,Math.round(drag.y+e.clientY-drag.sy));render();};window.onpointerup=()=>{drag=null;window.onpointermove=null;window.onpointerup=null;save()}}
function field(label,key,type='text'){const c=design.components.find(x=>x.id===selected);return `<div class="field"><label>${label}</label><input type="${type}" data-key="${key}" value="${esc(c[key])}"></div>`}
function renderProps(){const c=design.components.find(x=>x.id===selected);if(!c){props.innerHTML='<div class="empty">Select a component on the canvas to edit its properties.</div>';return}props.innerHTML=`<div class="field"><label>Type</label><input disabled value="${c.type}"></div>${['text'].includes(c.type)||c.type==='image'?field(c.type==='image'?'Image URL':'Text / Content','text','text'):''}<div class="row">${field('X','x','number')}${field('Y','y','number')}</div><div class="row">${field('Width','w','number')}${field('Height','h','number')}</div><div class="row">${field('Font size','fontSize','number')}${field('Radius','radius','number')}</div><div class="row">${field('Text color','color','text')}${field('Background','bg','text')}</div><div class="field"><label>Padding</label><input type="number" data-key="padding" value="${c.padding}"></div><button class="btn danger" style="width:100%;margin-top:6px" id="deleteBtn">Delete component</button>`;props.querySelectorAll('[data-key]').forEach(i=>i.oninput=()=>{let k=i.dataset.key;design.components.find(x=>x.id===selected)[k]=i.type==='number'?Number(i.value):i.value;save();render()});$('#deleteBtn').onclick=()=>{design.components=design.components.filter(x=>x.id!==selected);selected=null;save();render()}}
function source(){return `<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>My Design</title>\n<style>\n*{box-sizing:border-box}body{margin:0;background:${design.bg};font-family:Arial,sans-serif}.canvas{position:relative;width:${design.width}px;min-height:${design.height}px;margin:30px auto;background:${design.bg};overflow:hidden}.item{position:absolute;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;overflow:hidden}\n</style>\n</head>\n<body><main class="canvas">\n${design.components.map(c=>{let content=c.type==='image'?`<img src="${esc(c.text)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:c.type==='button'?`<button style="border:0;background:transparent;color:inherit;font:inherit">${esc(c.text)}</button>`:esc(c.text);return `<div class="item" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;color:${c.color};background:${c.bg};font-size:${c.fontSize}px;border-radius:${c.radius}px;padding:${c.padding}px">${content}</div>`}).join('\n')}\n</main></body></html>`}
function updateCode(){code.textContent=mode==='json'?JSON.stringify(design,null,2):source()}
function save(){localStorage.setItem('design-creator',JSON.stringify(design));$('#saveStatus').textContent='Saved '+new Date().toLocaleTimeString()}
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
Object.entries(types).forEach(([k,v])=>{let b=document.createElement('button');b.className='tool';b.innerHTML=`<span class="ico">${v[0]}</span><small>${v[1]}</small>`;b.onclick=()=>add(k);$('#tools').appendChild(b)});
art.onclick=()=>{selected=null;render()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');stage.classList.toggle('hidden',mode!=='design');code.classList.toggle('hidden',mode==='design');updateCode();render()});
$('#device').onchange=e=>{design.width=e.target.value==='mobile'?390:820;design.height=e.target.value==='mobile'?700:620;save();render()};
$('#newBtn').onclick=()=>{if(confirm('Create a new design?')){design={width:820,height:620,bg:'#ffffff',components:[]};selected=null;save();render()}};
$('#clearBtn').onclick=()=>{design.components=[];selected=null;save();render()};$('#saveBtn').onclick=()=>{save();toast('Design saved locally')};
$('#previewBtn').onclick=()=>{let w=window.open();w.document.write(source());w.document.close()};
$('#exportBtn').onclick=()=>{mode='source';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode==='source'));stage.classList.add('hidden');code.classList.remove('hidden');updateCode();navigator.clipboard?.writeText(source());toast('Source code copied')};
code.addEventListener('dblclick',()=>{navigator.clipboard?.writeText(code.textContent);toast('Code copied')});
render();
</script></body></html>
